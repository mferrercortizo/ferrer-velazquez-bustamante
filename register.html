<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NOVA Streetwear</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <div class="left">
            <a class="logo" href="./index.html">
                <img src="./img/logo.png" alt="">
            </a>
        </div>
        <nav class="right">
            <ul class="listainicio">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./login.html">Iniciar Sesión</a></li>
                <li><a href="./register.html">Registrarse</a></li>

            </ul>
        </nav>
    </header>

    <main class="registermain">
        <div class="formcontainer">
            <form action="./login.html" method="get">
                <div>
                    <label>Email</label>
                    <input class="log-reg" type="email" name="emailUsuario">
                </div>
                <div>
                    <label>Contraseña</label>
                    <input class="log-reg" type="password" name="contraseñaUsuario">
                </div>
                <div>
                    <label>Repetir contraseña</label>
                    <input class="log-reg" type="password" name="contraseñaRepetidaUsuario">
                </div>
                <div>
                    <label>
                        <input class="log-reg" type="checkbox" name="aceptar" required>Acepto los términos y condiciones
                    </label>
                </div>

                <button type="submit">Registrarme</button>
            </form>

            <section>
                <article>
                    <a href="./login.html">Ya tengo una cuenta</a>
                </article>
            </section>
        </div>
    </main>

    <footer class="pie">
        <div class="logopie">
            <img src="./img/logo.png" alt="">

        </div>
        <div class="nombrespie">
            <h4>Santiago Velazquez | Martin Ferrer | Thiago Bustamante</h4>

        </div>
        <div class="textopie">
            <p>© 2026 NOVA Streetwear. Todos los derechos reservados.</p>

        </div>
    </footer>

</body>

</html>
