<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NOVA Streetwear</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <div class="left">
            <a class="logo" href="./index.html">
                <img src="./img/logo.png" alt="">
            </a>
        </div>
        <div class="center">
            <form action="./search-results.html" method="get">
                <div>
                    <input class="campoBusqueda" type="search" name="buscar" value="" placeholder="Busca tu favorito">
                    <button type="submit">Buscar</button>
                </div>
            </form>

        </div>
        <nav class="right">
            <ul class="listainicio">
                <li><a href="./index.html">Home</a></li>
                <li id="item-login"><a href="./login.html">Iniciar Sesión</a></li>
                <li id="item-registro"><a href="./register.html">Registrarse</a></li>
                <li id="item-saludo"></li>
                <li id="item-logout"><a href="#">logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="registermain">
        <div class="formcontainer">
            <form action="./login.html" method="get">
                <div>
                    <label>Email</label>
                    <input class="log-reg" id="email-registro" type="email">
                </div>
                <div>
                    <label>Contraseña</label>
                    <input class="log-reg" id="password-registro" type="password">
                </div>
                <div>
                    <label>Repetir contraseña</label>
                    <input class="log-reg" id="password-repetida" type="password">
                </div>
                <div>
                    <label>
                        <input class="check" type="checkbox" required>Acepto los términos y condiciones
                    </label>
                </div>
                <p id="error-registro"></p>
                <button type="submit">Registrarme</button>
            </form>

            <section>
                <article>
                    <a href="./login.html">Ya tengo una cuenta</a>
                </article>
            </section>
        </div>
    </main>

    <footer class="pie">
        <div class="logopie">
            <img src="./img/logo.png" alt="logo">

        </div>
        <div class="nombrespie">
            <h4>Santiago Velazquez | Martin Ferrer | Thiago Bustamante</h4>

        </div>
        <div class="textopie">
            <p>© 2026 NOVA Streetwear. Todos los derechos reservados.</p>

        </div>
    </footer>
    <script src="./js/header.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/register.js"></script>
</body>

</html>
