<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Nova Streetwear</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <div class="left">
            <a class="logo" href="./index.html">
                <img src="./img/logo.png" alt="">
            </a>
        </div>
        <div class="center">
            <form action="./search-results.html" method="get">
                <div>
                    <input class="campoBusqueda" type="search" name="buscar" value="" placeholder="Busca tu favorito">
                    <button type="submit">Buscar</button>
                </div>
            </form>

        </div>
        <nav class="right">
            <ul class="listainicio">
                <li><a href="./index.html">Home</a></li>
                <li id="item-login"><a href="./login.html">Iniciar Sesión</a></li>
                <li id="item-registro"><a href="./register.html">Registrarse</a></li>
                <li id="item-saludo"></li>
                <li id="item-logout"><a href="#">logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <nav class="columna">
            <ul></ul>
        </nav>
        <div class="secciones">
            <section class="sectionproducto">
                <article class="fotosproducto">
                    <img class="fotoProducto" src="" alt="">
                </article>
                <article class="infoproducto">
                    <h2 class="nombreProducto"></h2>
                    <p class="marca"></p>
                    <p class="categoria"></p>
                    <h4 class="precio"></h4>
                    <p class="descripcion"></p>
                    <p class="stock"></p>
                    <ul class="tags"></ul>
                    <button type="button">Añadir al carrito</button>
                    <button type="button">Añadir a favoritos</button>
                </article>
            </section>
            <section class="reviews">
                <h2>Opiniones</h2>
                <div class="listaReviews"></div>
            </section>
        </div>
    </main>

    <footer class="pie">
        <div class="logopie">
            <img src="./img/logo.png" alt="logo">

        </div>
        <div class="nombrespie">
            <h4>Santiago Velazquez | Martin Ferrer | Thiago Bustamante</h4>

        </div>
        <div class="textopie">
            <p>© 2026 NOVA Streetwear. Todos los derechos reservados.</p>

        </div>
    </footer>
    <script src="./js/product.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/categories.js"></script>
    <script src="./js/saludo.js"></script>
</body>

</html>
